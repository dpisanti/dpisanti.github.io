baseURL = "https://dpisanti.github.io/"
theme = "blowfish"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0
buildDrafts = false
buildFuture = false
enableEmoji = false

[pagination]
  pagerSize = 100

[imaging]
  anchor = "Center"
  quality = 85

[taxonomies]
  tag = "tags"

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
